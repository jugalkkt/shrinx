{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<a href="/signup">Sign Up</a>
<a href="/login">Sign Up</a>
<form method="post" action="/links/new">
    <input type="text" name="destination" placeholder="https://example.com">
    <button type="submit">Shorten</button>
</form>
<h1>Your links</h1>

<ul>
{% for link in links %}
    <li>{{ link.short_code }} → {{ link.destination }}</li>
{% else %}
    <li>No links yet. Paste one above to get started.</li>
{% endfor %}
</ul>
{% endblock %}
